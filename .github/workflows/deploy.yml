name: Deploy Backend (main → produção)

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -eu
            set -o pipefail
            cd /var/www/mycriptonote/backend
            # Do not deploy this version until the required database migration is applied.
            printf '%s\n' "SELECT EXISTS (SELECT 1 FROM \"__EFMigrationsHistory\" WHERE \"MigrationId\" = '20260321165812_NormalizeUserEmailsToLowercase');" | docker compose -f docker-compose.prod.yml exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' | grep -qx t
            release=$(mktemp -d /var/www/mycriptonote/backend-release.XXXXXXXX)
            git clone --quiet --no-checkout https://github.com/gutocz/MyCriptoNoteBack.git "$release/source"
            git -C "$release/source" checkout --quiet --detach '${{ github.sha }}'
            test "$(git -C "$release/source" rev-parse HEAD)" = '${{ github.sha }}'
            # Preserve VPS-only production settings using a read-only bind mount.
            test -f MyCriptoNote.API/appsettings.Production.json
            printf 'services:\n  api:\n    build:\n      context: %s/source/MyCriptoNote.API\n    environment:\n      Google__ClientId: %s\n    volumes:\n      - /var/www/mycriptonote/backend/MyCriptoNote.API/appsettings.Production.json:/app/appsettings.Production.json:ro\n' "$release" '67406151511-upcvoaioteslopt4jgantn61v22k8e94.apps.googleusercontent.com' > "$release/compose.override.yml"
            docker compose -f docker-compose.prod.yml -f "$release/compose.override.yml" build api
            docker compose -f docker-compose.prod.yml -f "$release/compose.override.yml" up -d --no-deps api
